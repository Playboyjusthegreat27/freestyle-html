<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Friday Niite Freestyle: Refreshed</title>
	
	<meta name="description" content="Friday Niite Freestyle: Refreshed - A Psych Engine HTML5 port. Play in your browser!">
	<meta name="theme-color" content="#000000">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="mobile-web-app-capable" content="yes">
	
	<meta id="viewport" name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
	
	<link rel="shortcut icon" type="image/png" href="./favicon.png">
	<link rel="apple-touch-icon" href="./favicon.png">
	
	<!-- Open Graph / social -->
	<meta property="og:title" content="Friday Niite Freestyle: Refreshed">
	<meta property="og:description" content="Play this Psych Engine based FNF mod right in your browser!">
	<meta property="og:type" content="website">
	<meta property="og:image" content="./favicon.png">
	
	<script type="text/javascript" src="./Freestyle Refreshed.js"></script>
	
	<script>
		// Keep the game viewport stable on touch devices without shrinking the layout
		document.addEventListener("gesturestart", function (event) { event.preventDefault(); });
	</script>
	
	<style>
		html, body {
			margin: 0;
			padding: 0;
			height: 100%;
			height: 100dvh;
			width: 100%;
			overflow: hidden;
			overscroll-behavior: none;
			touch-action: none;
			background: #000;
			font-family: 'VCR OSD Mono', monospace, system-ui, sans-serif;
			color: #fff;
		}
		#openfl-content {
			background: #000000;
			width: 100vw;
			height: 100%;
			height: 100dvh;
			position: relative;
			overflow: hidden;
		}
		#openfl-content canvas {
			display: block;
			position: absolute;
			left: 50%;
			top: 50%;
			transform: translate(-50%, -50%);
			width: min(100vw, 177.7778dvh) !important;
			height: min(100dvh, 56.25vw) !important;
			max-width: 100vw;
			max-height: 100dvh;
			object-fit: contain;
			touch-action: none;
		}
		#loading {
			position: absolute;
			top: 0; left: 0; right: 0; bottom: 0;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			background: #000;
			z-index: 10;
			text-align: center;
			padding: 20px;
			box-sizing: border-box;
		}
		#loading h1 {
			font-size: 1.8rem;
			margin: 0 0 12px 0;
			letter-spacing: 1px;
		}
		#loading p {
			margin: 6px 0;
			opacity: 0.85;
			font-size: 0.95rem;
		}
		#loading .hint {
			margin-top: 24px;
			font-size: 0.8rem;
			opacity: 0.6;
			max-width: 420px;
			line-height: 1.4;
		}
		#loading .spinner {
			width: 40px;
			height: 40px;
			border: 4px solid rgba(255,255,255,0.2);
			border-top-color: #fff;
			border-radius: 50%;
			animation: spin 0.9s linear infinite;
			margin-bottom: 20px;
		}
		@keyframes spin {
			to { transform: rotate(360deg); }
		}
		@media (orientation: portrait) {
			#loading h1 { font-size: clamp(1.2rem, 5vw, 1.8rem); }
		}
		@font-face {
			font-family: 'VCR OSD Mono';
			src: url('assets/fonts/vcr.ttf') format('truetype');
			font-weight: normal;
			font-style: normal;
		}
		@font-face {
			font-family: 'Pixel Arial 11 Bold';
			src: url('assets/fonts/pixel.otf') format('truetype');
			font-weight: normal;
			font-style: normal;
		}
		@font-face {
			font-family: 'Nokia Cellphone FC Small';
			src: url('flixel/fonts/nokiafc22.ttf') format('truetype');
			font-weight: normal;
			font-style: normal;
		}
		@font-face {
			font-family: 'Monsterrat';
			src: url('flixel/fonts/monsterrat.ttf') format('truetype');
			font-weight: normal;
			font-style: normal;
		}
		/* Mobile controls stay outside the game canvas so they work in either orientation. */
		#mobile-controls {
			display: none;
			position: fixed;
			inset: 0;
			z-index: 30;
			pointer-events: none;
			padding:
				env(safe-area-inset-top, 0px)
				env(safe-area-inset-right, 0px)
				env(safe-area-inset-bottom, 0px)
				env(safe-area-inset-left, 0px);
			box-sizing: border-box;
		}
		.mobile-pad {
			position: absolute;
			left: 50%;
			bottom: max(14px, env(safe-area-inset-bottom));
			transform: translateX(-50%);
			display: grid;
			grid-template-columns: repeat(5, minmax(48px, 66px));
			gap: clamp(6px, 2vw, 14px);
			align-items: end;
		}
		.touch-btn {
			width: clamp(48px, 13vw, 66px);
			height: clamp(48px, 13vw, 66px);
			padding: 0;
			border: 2px solid rgba(255,255,255,.85);
			border-radius: 14px;
			background: rgba(20,20,20,.58);
			color: #fff;
			font: bold clamp(20px, 5vw, 28px) system-ui, sans-serif;
			text-shadow: 0 1px 3px #000;
			box-shadow: 0 2px 8px rgba(0,0,0,.35);
			pointer-events: auto;
			touch-action: none;
			user-select: none;
			-webkit-user-select: none;
			-webkit-tap-highlight-color: transparent;
		}
		.touch-btn.is-pressed {
			background: rgba(255,255,255,.42);
			transform: scale(.94);
		}
		#mobile-fullscreen {
			position: absolute;
			top: max(10px, env(safe-area-inset-top));
			right: max(10px, env(safe-area-inset-right));
			width: 42px;
			height: 42px;
			border: 1px solid rgba(255,255,255,.65);
			border-radius: 10px;
			background: rgba(20,20,20,.58);
			color: #fff;
			font-size: 25px;
			pointer-events: auto;
			touch-action: manipulation;
		}
		@media (pointer: coarse), (max-width: 900px) {
			#mobile-controls { display: block; }
		}
		@media (orientation: portrait) and (pointer: coarse) {
			.mobile-pad {
				bottom: max(18px, env(safe-area-inset-bottom));
				grid-template-columns: repeat(5, minmax(52px, 72px));
			}
			.touch-btn { width: clamp(52px, 16vw, 72px); height: clamp(52px, 16vw, 72px); }
		}
	</style>
</head>
<body>
	<noscript>
		<div style="padding:40px;text-align:center;font-family:sans-serif;">
			This game requires JavaScript. Please enable it in your browser.
		</div>
	</noscript>
	
	<div id="openfl-content">
		<div id="loading">
			<div class="spinner"></div>
			<h1>Friday Niite Freestyle</h1>
			<p>Refreshed • Psych Engine HTML5</p>
			<p>Loading game files... (this can take a moment on first visit)</p>
			<p class="hint">
				Tip: For best performance use Chrome / Edge. On mobile, add to Home Screen for fullscreen.
				<br><br>
				Source & credits on the repo →
				<a href="https://github.com/Playboyjusthegreat27/freestyle-html" style="color:#8af;" target="_blank" rel="noopener">GitHub</a>
			</p>
		</div>
	</div>

	<div id="mobile-controls" aria-label="Touch controls">
		<div class="mobile-pad">
			<button class="touch-btn" data-key="left" aria-label="Left">◀</button>
			<button class="touch-btn" data-key="down" aria-label="Down">▼</button>
			<button class="touch-btn" data-key="up" aria-label="Up">▲</button>
			<button class="touch-btn" data-key="right" aria-label="Right">▶</button>
			<button class="touch-btn" data-key="enter" aria-label="Enter or confirm">↵</button>
		</div>
		<button id="mobile-fullscreen" type="button" aria-label="Toggle fullscreen">⛶</button>
	</div>
	<script src="./mobile-controls.js"></script>
	
	<script type="text/javascript">
		// Hide loading screen once the game starts embedding
		function hideLoading() {
			var el = document.getElementById('loading');
			if (el) el.style.display = 'none';
		}
		
		// Give the big JS a moment, then embed
		window.addEventListener('load', function() {
			try {
				lime.embed("Freestyle Refreshed", "openfl-content", 1280, 720, { parameters: {} });
				// Hide loading after a short delay (game canvas usually takes over)
				setTimeout(hideLoading, 2500);
			} catch (e) {
				console.error(e);
				var el = document.getElementById('loading');
				if (el) {
					el.innerHTML = '<h1>Failed to load</h1><p>Check the browser console for errors.</p><p class="hint">' + (e.message || e) + '</p>';
				}
			}
		});
	</script>
</body>
</html>
